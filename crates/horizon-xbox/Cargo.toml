[package]
name = "horizon-xbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Horizon on Xbox One (Dev Mode): the UWP app shell"
publish = false

[[bin]]
name = "horizon_xbox"
path = "src/main.rs"

[dependencies]
horizon-core = { path = "../horizon-core" }

# An Xbox runs UWP apps only: CoreApplication instead of winit, which has no UWP backend.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "ApplicationModel_Core", "UI_Core", "Foundation", "Storage", "Win32_System_Com"] }
windows-core = "0.58"
